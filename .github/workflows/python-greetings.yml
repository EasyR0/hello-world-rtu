name: Python Greetings Pipeline

on:
  workflow_dispatch:

jobs:
  install-pip-deps:
    runs-on: self-hosted
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v6

      - name: Info
        run: echo Installing all required dependencies..
        shell: cmd

      - name: Install Python dependencies
        uses: ./.github/actions/install-pip-deps
        with:
          app_path: python-greetings

  deploy-to-dev:
    runs-on: self-hosted
    needs: install-pip-deps
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v6

      - name: Info
        run: echo Deploying application to DEV..
        shell: cmd

      - name: Deploy to DEV
        uses: ./.github/actions/deploy
        with:
          env_name: dev
          port: "7001"
          app_path: python-greetings
