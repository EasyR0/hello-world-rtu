name: Python Greetings Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  install-pip-deps:
    runs-on: self-hosted
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v6

      - name: Info
        run: echo Installing all required dependencies..
        shell: cmd

      - name: Debug files
        run: dir .github\actions\install-pip-deps
        shell: cmd

      - name: Install Python dependencies
        uses: ./.github/actions/install-pip-deps
        with:
          app_path: python-greetings
