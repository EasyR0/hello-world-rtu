name: Python Greetings Pipeline
# test
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  install-pip-deps:
    runs-on: self-hosted
    steps:
      - name: Info
        run: echo Installing all required dependencies..
        shell: cmd

      - name: Install Python dependencies
        uses: ./.github/actions/install-pip-deps
        with:
          app_path: python-greetings

  deploy-to-dev:
    runs-on: self-hosted
    needs: install-pip-deps
    steps:
      - name: Info
        run: echo Deploying application to DEV..
        shell: cmd

      - name: Deploy to DEV
        uses: ./.github/actions/deploy
        with:
          env_name: dev
          port: "7001"
          app_path: python-greetings

  tests-on-dev:
    runs-on: self-hosted
    needs: deploy-to-dev
    steps:
      - name: Info
        run: echo Running tests on DEV..
        shell: cmd

      - name: Test DEV
        uses: ./.github/actions/test
        with:
          env_name: dev
          test_path: course-js-api-framework

  deploy-to-stg:
    runs-on: self-hosted
    needs: tests-on-dev
    steps:
      - name: Info
        run: echo Deploying application to STG..
        shell: cmd

      - name: Deploy to STG
        uses: ./.github/actions/deploy
        with:
          env_name: stg
          port: "7002"
          app_path: python-greetings

  tests-on-stg:
    runs-on: self-hosted
    needs: deploy-to-stg
    steps:
      - name: Info
        run: echo Running tests on STG..
        shell: cmd

      - name: Test STG
        uses: ./.github/actions/test
        with:
          env_name: stg
          test_path: course-js-api-framework

  deploy-to-preprod:
    runs-on: self-hosted
    needs: tests-on-stg
    steps:
      - name: Info
        run: echo Deploying application to PREPROD..
        shell: cmd

      - name: Deploy to PREPROD
        uses: ./.github/actions/deploy
        with:
          env_name: preprod
          port: "7003"
          app_path: python-greetings

  tests-on-preprod:
    runs-on: self-hosted
    needs: deploy-to-preprod
    steps:
      - name: Info
        run: echo Running tests on PREPROD..
        shell: cmd

      - name: Test PREPROD
        uses: ./.github/actions/test
        with:
          env_name: preprod
          test_path: course-js-api-framework

  deploy-to-prod:
    runs-on: self-hosted
    needs: tests-on-preprod
    steps:
      - name: Info
        run: echo Deploying application to PROD..
        shell: cmd

      - name: Deploy to PROD
        uses: ./.github/actions/deploy
        with:
          env_name: prod
          port: "7004"
          app_path: python-greetings

  tests-on-prod:
    runs-on: self-hosted
    needs: deploy-to-prod
    steps:
      - name: Info
        run: echo Running tests on PROD..
        shell: cmd

      - name: Test PROD
        uses: ./.github/actions/test
        with:
          env_name: prod
          test_path: course-js-api-framework
