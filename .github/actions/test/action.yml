name: Run greetings tests
description: Clone test repo and run tests

inputs:
  env_name:
    required: true
  test_path:
    required: true

runs:
  using: composite
  steps:
    - name: Checkout pipeline repo
      uses: actions/checkout@v6

    - name: Clone test repository
      uses: actions/checkout@v6
      with:
        repository: mtararujs/course-js-api-framework
        path: ${{ inputs.test_path }}

    - name: Show Node version
      run: node -v
      shell: cmd
      working-directory: ${{ inputs.test_path }}

    - name: Show NPM version
      run: npm -v
      shell: cmd
      working-directory: ${{ inputs.test_path }}

    - name: Install npm dependencies
      run: npm install
      shell: cmd
      working-directory: ${{ inputs.test_path }}

    - name: Show package scripts
      run: type package.json
      shell: cmd
      working-directory: ${{ inputs.test_path }}

    - name: Run tests
      run: npm run greetings greetings_${{ inputs.env_name }}
      shell: cmd
      working-directory: ${{ inputs.test_path }}
